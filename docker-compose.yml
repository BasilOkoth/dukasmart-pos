services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dukasmart
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: dukasmart
    volumes: [dukasmart_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukasmart"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://dukasmart:localpass@db:5432/dukasmart
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: ./frontend
      args: {VITE_API_URL: "http://localhost:8000"}
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  dukasmart_pg:
